<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Host page — embedded configurator example</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f4f5f7; }
      h1 { font-size: 18px; }
      iframe { width: 100%; height: 800px; border: 1px solid #d4d7dc; border-radius: 8px; }
      #log { margin-top: 16px; padding: 12px; background: #111318; color: #d7fac0; font: 12px/1.5 monospace; border-radius: 6px; min-height: 60px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Example third-party storefront page</h1>
    <p>This simulates a Shopify product page embedding the configurator in an &lt;iframe&gt; and listening for its events.</p>
    <!-- productId is optional — the app defaults to the tent if omitted. -->
    <iframe src="/?productId=canopy-tent-10x10" title="Product configurator"></iframe>
    <div id="log">Waiting for messages from the embedded configurator…</div>

    <script>
      const log = document.getElementById('log');
      window.addEventListener('message', (event) => {
        const data = event.data;
        if (!data || data.source !== 'product-configurator') return;
        log.textContent += `\n[${new Date().toLocaleTimeString()}] ${data.type} ${JSON.stringify(data.payload ?? {})}`;
        if (data.type === 'ADD_TO_CART') {
          // A real host page would now e.g. open its own cart drawer, or
          // call Shopify's Storefront API itself using data.payload.
          console.log('Product added to cart from embedded configurator:', data.payload);
        }
      });
    </script>
  </body>
</html>
